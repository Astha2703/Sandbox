
<!DOCTYPE html>
<html lang="en">
<head>

  <script>
    // Initialize dataLayer and gtag
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Boot GA4
    gtag('js', new Date());

    // GA4 configuration (automatically sends page_view)
    gtag('config', 'G-WS84NQKECV', {
      // Uncomment to surface events in Admin > DebugView during testing
      // 'debug_mode': true
    });
  </script>

  <meta charset="UTF-8">
  <title>GA4 Practice Sandbox</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; background: #f4f4f4; }
    section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; color: white; }
    .primary { background: #007bff; }
    .secondary { background: #6c757d; }
    .buy { background: #28a745; }
    input, select { display: block; width: 100%; padding: 8px; margin: 10px 0; }
  </style>
</head>
<body>

  <h1>GA4 Practice Sandbox</h1>
  <p>Using this page to practice events and data layer pushes.</p>

  <section>
    <h2>1. Click Tracking Practice</h2>
    <button id="main-cta" class="btn primary">ID-Based Button</button>
    <button class="btn secondary practice-class">Class-Based Button</button>
    <a href="https://www.google.com" target="_blank" class="btn primary">External Link Click</a>
  </section>

  <section>
    <h2>2. Form Tracking Practice</h2>
    <form id="contact-form">
      <label>Name:</label>
      <input type="text" name="user_name" placeholder="Enter name" required>
      <label>Inquiry Type:</label>
      <select name="type">
        <option value="support">Support</option>
        <option value="sales">Sales</option>
      </select>
      <button type="submit" class="btn primary">Submit Form</button>
    </form>
    <p id="form-msg" style="display:none; color: green;">Form submitted successfully!</p>
  </section>

  <section>
    <h2>3. Data Layer & Ecommerce Practice</h2>
    <div class="product">
      <p><strong>Product:</strong> Pro Analytics Course</p>
      <p>Price: $99</p>
      <button class="btn buy"
        onclick="dataLayer.push({event: 'add_to_cart', product_name: 'Pro Course', price: 99});">
        Add to Cart (DataLayer)
      </button>
    </div>
  </section>

  <script>
    // Show success message on form submit and send a GA4 event
    document.getElementById('contact-form').onsubmit = function(e) {
      e.preventDefault();
      document.getElementById('form-msg').style.display = 'block';

      // Example GA4 custom event for form submission
      gtag('event', 'form_submit', {
        form_id: 'contact-form',
        inquiry_type: document.querySelector('select button click
    document.getElementById('main-cta').addEventListener('click', function() {
      gtag('event', 'select_content', {
        content_type: 'button',
        content_id: 'main-cta'
      });
    });
  </script>
</body>
</html>
